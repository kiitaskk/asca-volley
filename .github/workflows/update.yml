name: Mise à jour du calendrier

on:
  schedule:
    # Toutes les heures entre 8h et 23h (heure d'hiver française), plus une fois la nuit
    - cron: "17 7-22 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch: # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lire le site FFvolley
        run: python scripts/update.py

      - name: Enregistrer les changements
        run: |
          if git diff --quiet -- data.json; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Mise à jour des matchs"
          git push
